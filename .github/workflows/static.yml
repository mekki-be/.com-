                ${currentLang === 'ar' ? 'زيارة الوكالة ←' : 'Voir en agence →'}
              </a>
            </div>
          `;

          fleetGridEl.appendChild(card);
        });

        fleetGridEl.querySelectorAll('.fleet-card-trigger').forEach((btn) => {
          btn.addEventListener('click', () => {
            const index = parseInt(btn.getAttribute('data-idx') || '0', 10);
            openLightbox(index);
          });
        });
      }

      filterBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const selectedFilter = btn.getAttribute('data-filter') || 'all';
          filterBtns.forEach((b) => {
            b.classList.remove('active', 'bg-bronze', 'text-obsidian', 'border-bronze', 'font-bold');
            b.classList.add('bg-asphalt', 'text-alabaster', 'border-white/10', 'font-semibold');
          });
          btn.classList.remove('bg-asphalt', 'text-alabaster', 'border-white/10', 'font-semibold');
          btn.classList.add('active', 'bg-bronze', 'text-obsidian', 'border-bronze', 'font-bold');
          renderFleetGrid(selectedFilter);
        });
      });

      function updateLightboxContent() {
        const item = currentFilteredList[currentLightboxIndex];
        if (!item || !lightboxImg) return;
        const title = currentLang === 'ar' ? item.titleAr : item.titleFr;
        const cat = currentLang === 'ar' ? item.catAr : item.catFr;
        const desc = currentLang === 'ar' ? item.descAr : item.descFr;

        lightboxImg.src = item.src;
        lightboxImg.alt = title;
        if (lightboxTitle) lightboxTitle.textContent = title;
        if (lightboxCategory) lightboxCategory.textContent = cat;
        if (lightboxDesc) lightboxDesc.textContent = desc;
        if (lightboxCounter) {
          lightboxCounter.textContent = `${currentLightboxIndex + 1} / ${currentFilteredList.length}`;
        }
      }

      function openLightbox(index) {
        if (!lightboxEl) return;
        currentLightboxIndex = index;
        updateLightboxContent();
        lightboxEl.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        if (!lightboxEl) return;
        lightboxEl.classList.add('hidden');
        document.body.style.overflow = '';
      }

      if (lightboxCloseBtn) {
        lightboxCloseBtn.addEventListener('click', closeLightbox);
      }
      if (lightboxPrevBtn) {
        lightboxPrevBtn.addEventListener('click', () => {
          currentLightboxIndex = (currentLightboxIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
          updateLightboxContent();
        });
      }
      if (lightboxNextBtn) {
        lightboxNextBtn.addEventListener('click', () => {
          currentLightboxIndex = (currentLightboxIndex + 1) % currentFilteredList.length;
          updateLightboxContent();
        });
      }
